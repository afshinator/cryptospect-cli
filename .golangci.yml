version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - gocritic          # opinionated but catches real bugs
    - revive            # golint replacement, configurable
    - misspell          # typos in comments/strings
    - prealloc          # slice preallocation hints
    - noctx             # HTTP requests without context (critical for your API clients)
    - exhaustive        # switch exhaustiveness on enums
    - errorlint         # error wrapping best practices
    - bodyclose         # unclosed HTTP response bodies
    - nilerr            # returning nil when err != nil

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers]

formatters:
  enable:
    - goimports
    - gofumpt

  exclusions:
    generated: strict