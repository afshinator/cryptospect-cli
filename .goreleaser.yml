version: 2
builds:
  - main: ./cmd/cryptospect-cli
    binary: cryptospect-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - format: tar.gz

checksum:
  name_template: "checksums.txt"