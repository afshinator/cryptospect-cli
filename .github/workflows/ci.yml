name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: fmt check
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.45.0
          go install mvdan.cc/gofumpt@v0.10.0
          # Exclude cache directories from formatting checks
          find . -name "*.go" -not -path "./.cache/*" -not -path "./.gomodcache/*" -not -path "./.go/*" -not -path "./vendor/*" \
            -exec goimports -l {} \; | tee /dev/stderr | (! read)
          find . -name "*.go" -not -path "./.cache/*" -not -path "./.gomodcache/*" -not -path "./.go/*" -not -path "./vendor/*" \
            -exec gofumpt -l {} \; | tee /dev/stderr | (! read)

      - name: go mod download
        run: go mod download

      - name: build (for typecheck)
        run: go build ./cmd/cryptospect-cli

      - name: lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -cover ./...

      - name: build
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/cryptospect-cli/